name: Build Signed Release APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Create Release Keystore and Web Client ID
        run: |
          keytool -genkey -v -keystore my-upload-key.jks -storepass Whatschedule123 -alias upload -keypass Whatschedule123 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Whatschedule,O=Developer,C=IN"
          mkdir -p app/src/main/res/values
          cat << 'EOF' > app/src/main/res/values/firebase_fix.xml
          <resources>
              <string name="default_web_client_id" translatable="false">119803823085-2es6p634h8l097js1dtu9su1kat3ddne.apps.googleusercontent.com</string>
          </resources>
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Signed Release APK
        env:
          STORE_PASSWORD: Whatschedule123
          KEY_PASSWORD: Whatschedule123
        run: gradle assembleRelease

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Whatschedule-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
          
